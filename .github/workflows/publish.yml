name: Publish package to GitHub Packages
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate semver version
        run: |
          if ! echo "${{ github.ref_name }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '${{ github.ref_name }}' is not valid semver (expected x.y.z)"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Publish artifact
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper
          arguments: publish -Pversion=${{ github.ref_name }} -PGITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -PGITHUB_USER=${{ github.actor }}
